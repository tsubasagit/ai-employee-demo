<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1600px;height:1000px;overflow:hidden}
body{background:#ececea;color:#1a1a1a;font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;display:flex}
.left{width:580px;padding:64px 44px 48px 72px;display:flex;flex-direction:column}
.kicker{font-size:15px;letter-spacing:.08em;color:#555;display:flex;align-items:center;gap:10px}
.kicker b{color:#1a1a1a}
.kicker i{display:inline-block;width:28px;height:2px;background:#1a1a1a}
.num{font-size:96px;font-weight:800;line-height:1;margin:72px 0 12px;letter-spacing:-.02em}
.num small{font-size:22px;font-weight:500;color:#888;margin-left:8px;letter-spacing:0}
h1{font-size:36px;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35;margin:0 0 22px;font-weight:800}
p.desc{font-size:18px;line-height:1.85;color:#333;margin:0 0 26px}
ul{list-style:none;padding:0;margin:0}
li{font-size:16.5px;line-height:1.6;padding:10px 0 10px 30px;border-top:1px solid #d4d4d0;position:relative}
li:last-child{border-bottom:1px solid #d4d4d0}
li::before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;border-radius:50%;background:#1a1a1a}
.foot{margin-top:auto;font-size:13px;color:#777;line-height:1.7}
.foot b{display:block;font-size:16px;color:#1a1a1a;margin-bottom:4px}
.right{flex:1;padding:48px 64px 48px 8px;display:flex;align-items:center}
.win{width:100%;height:100%;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column}
.bar{height:44px;background:#f6f6f4;border-bottom:1px solid #e2e2df;display:flex;align-items:center;gap:8px;padding:0 16px;flex:none}
.bar span{width:12px;height:12px;border-radius:50%;background:#d6d6d2}
.bar .url{margin-left:16px;flex:1;height:26px;border-radius:7px;background:#fff;border:1px solid #e2e2df;font-size:13px;color:#888;display:flex;align-items:center;padding:0 12px}
iframe{border:0;flex:1;width:100%}
</style></head>
<body>
  <div class="left">
    <div class="kicker"><i></i><b>AI社員</b> 導入イメージのご提案</div>
    <div class="num" id="num"></div>
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
    <ul id="pts"></ul>
    <div class="foot"><b>株式会社プレスマン</b>※画面は社員10名の架空の会社「あおば住設」での導入イメージです。</div>
  </div>
  <div class="right">
    <div class="win">
      <div class="bar"><span></span><span></span><span></span><div class="url">AI社員 ─ 株式会社あおば住設</div></div>
      <iframe id="app" src="app/index.html"></iframe>
    </div>
  </div>
<script>
window.setScene = (n, total, title, desc, pts) => {
  document.getElementById("num").innerHTML = String(n).padStart(2,"0") + `<small>/ ${String(total).padStart(2,"0")}</small>`;
  document.getElementById("title").innerHTML = title;
  document.getElementById("desc").textContent = desc;
  document.getElementById("pts").innerHTML = pts.map(p => `<li>${p}</li>`).join("");
};
</script>
</body></html>
